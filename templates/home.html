{% extends "base.html" %}

{% block content %}

<style>
    /* Full-screen background image */
    .home-bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: url('https://images.unsplash.com/photo-1529933030474-182f3f1e1135?auto=format&fit=crop&w=1500&q=80');
        background-size: cover;
        background-position: center;
        filter: brightness(0.75);
        z-index: -2;
    }

    /* Pastel overlay to match theme */
    .home-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(135deg, rgba(227,242,253,0.55), rgba(252,228,236,0.55));
        z-index: -1;
    }

    /* Centered welcome card */
    .welcome-card {
        max-width: 600px;
        margin: 120px auto;
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(6px);
        padding: 35px;
        text-align: center;
        border-radius: 18px;
        box-shadow: 0 8px 28px rgba(0,0,0,0.15);
        animation: fadeIn 0.6s ease;
    }

    .welcome-title {
        color: #6C63FF;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .welcome-text {
        font-size: 18px;
        color: #444;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

<!-- Background Elements -->
<div class="home-bg"></div>
<div class="home-overlay"></div>

<!-- Foreground Content -->
<div class="welcome-card">
    <h1 class="welcome-title">🍌 Banana Commission System</h1>
    <p class="welcome-text">Select an option from the menu to get started.</p>
</div>

{% endblock %}

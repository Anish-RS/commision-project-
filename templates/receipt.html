{% extends "base.html" %}
{% block content %}
<style>
* { box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #eaf6ff, #fff0f4);
}

.page-title {
  text-align: center;
  color: #6C63FF;
  font-size: 26px;
  font-weight: 700;
  margin: 20px 0;
}

.card {
  max-width: 560px;
  margin: 0 auto;
  background: rgba(255,255,255,0.96);
  padding: 22px;
  border-radius: 14px;
  border-left: 6px solid #90CAF9;
  box-shadow: 0 10px 30px rgba(28,37,70,0.08);
}

.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  height: 44px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid #dbefff;
  background: #eaf6ff;
  font-size: 15px;
  outline: none;
  transition: 0.15s;
}

input:focus, select:focus {
  background: #fff;
  border-color: #64b5f6;
  box-shadow: 0 4px 12px rgba(100,181,246,0.15);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #81c784, #4caf50);
  color: white;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(76,175,80,0.25);
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(76,175,80,0.35);
}
</style>

<h2>Receipt (Money Received)</h2>

<form method="POST" style="max-width:560px;" id="receiptForm">

  <!-- DATE -->
  <div>
    <label>Date:</label>
    <input type="date" name="tx_date" id="tx_date" required>
  </div>

  <!-- ENTITY TYPE -->
  <div>
    <label>Entity Type:</label>
    <select name="entity_type"
        id="entity_type"
        required>
      <option value="customer">Customer</option>
      <option value="supplier">Supplier</option>
    </select>
  </div>

  
  <div>
    <label>Customer / Supplier:</label>
  
    <input type="text"
           id="entity_search"
           name="entity_name"
           placeholder="Type ID or Name..."
           autocomplete="off"
           required>
    
    <div id="suggestions"
         style="
            display:none;
            background:#fff;
            border:1px solid #ddd;
            border-radius:10px;
            max-height:220px;
            overflow-y:auto;
            margin-top:4px;">
    </div>
  </div>
  <!-- AMOUNT -->
  <div>
    <label>Amount:</label>
    <input type="number" step="0.01" name="amount" required>
  </div>

  <!-- NOTE -->
  <div>
    <label>Note (optional):</label>
    <input type="text" name="note">
  </div>

  <div style="margin-top:10px;">
    <button type="submit">Save Receipt</button>
  </div>

</form>

<script>

const allEntities = [
{% for c in customers %}
{
  type: "customer",
  value: "{{ c.id }} - {{ c.name }}"
},
{% endfor %}

{% for s in suppliers %}
{
  type: "supplier",
  value: "{{ s.id }} - {{ s.name }}"
},
{% endfor %}
];

const input = document.getElementById("entity_search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", function () {

  const text = this.value.toLowerCase().trim();
  const entityType =
      document.getElementById("entity_type").value;

  suggestions.innerHTML = "";

  if (text.length < 1) {
    suggestions.style.display = "none";
    return;
  }

  const matches = allEntities.filter(x =>
      x.type === entityType &&
      x.value.toLowerCase().includes(text)
  );

  matches.slice(0, 20).forEach(item => {

    const div = document.createElement("div");

    div.style.padding = "10px";
    div.style.cursor = "pointer";

    div.innerText = item.value;

    div.onclick = function () {
      input.value = item.value;
      suggestions.style.display = "none";
    };

    suggestions.appendChild(div);
  });

  suggestions.style.display =
      matches.length ? "block" : "none";
});

document.addEventListener("click", function(e){
  if (!suggestions.contains(e.target) &&
      e.target !== input) {
      suggestions.style.display = "none";
  }
});

  

// prevent empty submissions
document.getElementById("receiptForm").addEventListener("submit", function(e) {

  if (!document.getElementById("entity_name").value) {
    e.preventDefault();
    alert("Please select a customer/supplier.");
    return false;
  }

});
// init on page load
document.addEventListener("DOMContentLoaded", function() {
  // --- NEW: Auto-set today's date ---
  const dateInput = document.getElementById("tx_date");
  if (!dateInput.value) {
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
  }
});
</script>

{% endblock %}

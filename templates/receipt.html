{% extends "base.html" %}
{% block content %}
<style>
* { box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #eaf6ff, #fff0f4);
}

.page-title {
  text-align: center;
  color: #6C63FF;
  font-size: 26px;
  font-weight: 700;
  margin: 20px 0;
}

.card {
  max-width: 560px;
  margin: 0 auto;
  background: rgba(255,255,255,0.96);
  padding: 22px;
  border-radius: 14px;
  border-left: 6px solid #90CAF9;
  box-shadow: 0 10px 30px rgba(28,37,70,0.08);
}

.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  height: 44px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid #dbefff;
  background: #eaf6ff;
  font-size: 15px;
  outline: none;
  transition: 0.15s;
}

input:focus, select:focus {
  background: #fff;
  border-color: #64b5f6;
  box-shadow: 0 4px 12px rgba(100,181,246,0.15);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #81c784, #4caf50);
  color: white;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(76,175,80,0.25);
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(76,175,80,0.35);
}
</style>

<h2>Receipt (Money Received)</h2>

<form method="POST" style="max-width:560px;" id="receiptForm">

  <!-- DATE -->
  <div>
    <label>Date:</label>
    <input type="date" name="tx_date" id="tx_date" required>
  </div>

  <!-- ENTITY TYPE -->
  <div>
    <label>Entity Type:</label>
    <select name="entity_type" id="entity_type" onchange="filterNames()" required>
      <option value="customer">Customer</option>
      <option value="supplier">Supplier</option>
    </select>
  </div>

  <!-- SEARCH BY -->
  <div>
    <label>Search By:</label>
    <select name="search_by" id="search_by" onchange="toggleInputs()">
      <option value="name" selected>Name</option>
      <option value="id">ID</option>
    </select>

  </div>

  <!-- ID INPUT -->
  <div id="id_block" style="display:none;">
    <label>Entity ID:</label>
    <input type="number" name="entity_id" id="entity_id">
  </div>

  <!-- NAME SELECT -->
  <div id="name_block">
    <label>Select Name:</label>
    <select name="entity_name" id="entity_name">
      <option value="">-- Select --</option>

      <!-- Customers -->
      {% for c in customers %}
        <option value="{{ c.id }}" data-type="customer">{{ c.name }}</option>
      {% endfor %}

      <!-- Suppliers -->
      {% for s in suppliers %}
        <option value="{{ s.id }}" data-type="supplier">{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- AMOUNT -->
  <div>
    <label>Amount:</label>
    <input type="number" step="0.01" name="amount" required>
  </div>

  <!-- NOTE -->
  <div>
    <label>Note (optional):</label>
    <input type="text" name="note">
  </div>

  <div style="margin-top:10px;">
    <button type="submit">Save Receipt</button>
  </div>

</form>

<script>
function toggleInputs() {
  const mode = document.getElementById("search_by").value;

  const idBlock = document.getElementById("id_block");
  const nameBlock = document.getElementById("name_block");
  const idInput = document.getElementById("entity_id");
  const nameSelect = document.getElementById("entity_name");

  if (mode === "id") {
    idBlock.style.display = "block";
    nameBlock.style.display = "none";
    idInput.required = true;
    nameSelect.required = false;
  } else {
    idBlock.style.display = "none";
    nameBlock.style.display = "block";
    idInput.required = false;
    nameSelect.required = true;
  }
}

function filterNames() {
  const entityType = document.getElementById("entity_type").value;
  const options = document.getElementById("entity_name").options;

  for (let i = 0; i < options.length; i++) {
    const opt = options[i];
    const t = opt.getAttribute("data-type");

    if (!t) {   // default "-- Select --"
      opt.style.display = "";
      continue;
    }

    opt.style.display = (t === entityType) ? "" : "none";
  }

  document.getElementById("entity_name").value = "";
}

// prevent empty submissions
document.getElementById("receiptForm").addEventListener("submit", function(e) {
  const mode = document.getElementById("search_by").value;

  if (mode === "name") {
    if (!document.getElementById("entity_name").value) {
      e.preventDefault();
      alert("Please select a name.");
      return false;
    }
  } else {
    if (!document.getElementById("entity_id").value) {
      e.preventDefault();
      alert("Please enter an ID.");
      return false;
    }
  }
});

// init on page load
document.addEventListener("DOMContentLoaded", function() {
  // --- NEW: Auto-set today's date ---
  const dateInput = document.getElementById("tx_date");
  if (!dateInput.value) {
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;
  }

  toggleInputs();
  filterNames();
});
</script>

{% endblock %}

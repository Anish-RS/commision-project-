
{% extends "base.html" %}
{% block content %}

<style>
  /* Reset useful defaults for the form */
  * { box-sizing: border-box; }

  /* Pastel background */
  body {
    background: linear-gradient(135deg, #ffeaf0, #fff0f1);
    background-attachment: fixed;
  }

  .page-title {
    color: #6C63FF;
    font-size: 26px;
    font-weight: 700;
    margin: 18px 0;
    text-align: center;
  }

  /* Autocomplete suggestion active state */
  .suggestion-item.active {
    background: #90caf9;
  }

  /* Card container */
  .card {
    background: #ffffffef;
    padding: 22px;
    border-radius: 14px;
    max-width: 860px;
    margin: 18px auto;
    box-shadow: 0 10px 30px rgba(28,37,70,0.06);
    border-left: 6px solid #90CAF9;
  }

  /* Common label style */
  label {
    display: block;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
  }

  /* Unified input/select style */
  .input-field, select.input-field {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #dbefff;
    background: #eaf6ff;
    outline: none;
    transition: 0.16s ease;
    font-size: 15px;
    height: 44px;
    line-height: 20px;
  }

  /* Ensure selects visually match inputs across browsers */
  select.input-field {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, rgba(0,0,0,0.25) 50%),
                      linear-gradient(135deg, rgba(0,0,0,0.25) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(1em + 2px), calc(100% - 13px) calc(1em + 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }

  .input-field:focus, select.input-field:focus {
    border-color: #64b5f6;
    background: #fff;
    box-shadow: 0 4px 12px rgba(100,181,246,0.12);
  }

  /* Layout rows */
  .form-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .col-full { width: 100%; min-width: 0; }

  /* Amount/note grid ensures labels line up and equal heights */
  .grid-amount-note {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
    align-items: start;
  }

  /* Helper text */
  .small-note { font-size: 13px; color: #666; margin-top: 8px; }

  /* Button row */
  .actions { display:flex; justify-content:flex-end; margin-top: 14px; }

  .btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary {
    background: linear-gradient(90deg,#ff9a9a,#ff6b6b);
    color: white;
    box-shadow: 0 6px 18px rgba(255,107,107,0.18);
    transition: 0.15s;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(255,107,107,0.28);
  }

  @media (max-width: 720px) {
    .grid-amount-note { grid-template-columns: 1fr; }
  }
</style>

<h2 class="page-title">Add Old Balance (Supplier / Customer)</h2>

<div class="card">
  <form method="POST" id="adjust-form" novalidate>

    <div class="form-row" style="margin-bottom:14px;">
      <div class="col-full">
        <label for="entity_type">Entity Type</label>
        <select id="entity_type" name="entity_type" class="input-field" onchange="onModeChange()" required>
            <option value="supplier">Supplier</option>
            <option value="customer" selected>Customer</option>
        </select>
      </div>
    </div>

    <div class="form-row" style="margin-bottom:14px;">
      <div class="col-full">
        <label for="searchBox">Search Supplier / Customer</label>
    
        <input
          id="searchBox"
          type="text"
          class="input-field"
          placeholder="Type Supplier/Customer Name or ID..."
          autocomplete="off"
        >
    
        <input type="hidden" id="entity_id" name="entity_id">
    
        <div id="suggestions"
             style="
                display:none;
                background:#fff;
                border:1px solid #dbefff;
                border-radius:10px;
                max-height:220px;
                overflow-y:auto;
                margin-top:5px;
                box-shadow:0 4px 10px rgba(0,0,0,.08);
                z-index:999;
                position:relative;">
        </div>
    
        <div class="small-note">
          Type name or ID. Suggestions appear automatically.
        </div>
      </div>
    </div>

    <div class="grid-amount-note" style="margin-top:10px;">
      <div>
        <label for="amount">Amount (₹)</label>
        <input id="amount" name="amount" type="number" min="0" step="0.01" class="input-field" required>
      </div>

      <div>
        <label for="note">Note (optional)</label>
        <input id="note" name="note" type="text" class="input-field" placeholder="Reason / remark">
      </div>
    </div>

    <div class="actions">
      <button type="submit" id="submitBtn" class="btn btn-primary">Apply Adjustment</button>
    </div>

  </form>
</div>

<script>
  // Safely looping through backend data to prevent javascript syntax errors
  const allEntities = [
    {% for c in customers %}
    { type: "customer", id: "{{ c.id }}", name: "{{ c.name }}" },
    {% endfor %}

    {% for s in suppliers %}
    { type: "supplier", id: "{{ s.id }}", name: "{{ s.name }}" },
    {% endfor %}
  ];

  let activeIndex = -1;
  const searchBox = document.getElementById("searchBox");
  const suggestionBox = document.getElementById("suggestions");
  const entityIdField = document.getElementById("entity_id");
  const entityTypeField = document.getElementById("entity_type");

  function setupAutocomplete() {
      searchBox.addEventListener("input", function () {
          activeIndex = -1;
          const query = this.value.trim().toLowerCase();
          const mode = entityTypeField.value;

          suggestionBox.innerHTML = "";

          if (query.length < 1) {
              suggestionBox.style.display = "none";
              entityIdField.value = "";
              return;
          }

          // Filter by the selected entity type, and match query to ID or Name
          const matches = allEntities.filter(item =>
              item.type === mode &&
              ((item.name || "").toLowerCase().includes(query) ||
               String(item.id).includes(query))
          );

          activeIndex = matches.length ? 0 : -1;

          if (matches.length === 0) {
              suggestionBox.style.display = "none";
              return;
          }

          matches.slice(0, 20).forEach((item) => {
              const row = document.createElement("div");
              row.className = "suggestion-item";
              row.style.padding = "10px";
              row.style.cursor = "pointer";
              row.style.borderBottom = "1px solid #eee";

              row.innerHTML = `<strong>${item.name}</strong> (ID: ${item.id})`;

              row.onclick = function () {
                  searchBox.value = `${item.name} (ID: ${item.id})`;
                  entityIdField.value = item.id;
                  suggestionBox.style.display = "none";

                  setTimeout(() => {
                      document.getElementById("amount").focus();
                  }, 0);
              };

              suggestionBox.appendChild(row);
          });

          suggestionBox.style.display = "block";

          if (activeIndex === 0) {
            const first = suggestionBox.querySelector(".suggestion-item");
            if (first) first.classList.add("active");
          }
      });

      // Suggestion box keyboard navigation
      searchBox.addEventListener("keydown", function(e) {
          const items = suggestionBox.querySelectorAll(".suggestion-item");
          if (!items.length) return;

          if (e.key === "ArrowDown") {
              e.preventDefault();
              if (activeIndex < items.length - 1) activeIndex++;
          } else if (e.key === "ArrowUp") {
              e.preventDefault();
              if (activeIndex > 0) activeIndex--;
          } else if (e.key === "Enter") {
              e.preventDefault();
              if (activeIndex >= 0) {
                  items[activeIndex].click();
                  return;
              } else if (items.length === 1) {
                  items[0].click();
                  return;
              }
              return;
          }
          
          items.forEach(i => i.classList.remove("active"));
          if (activeIndex >= 0) {
              items[activeIndex].classList.add("active");
              items[activeIndex].scrollIntoView({ block: "nearest" });
          }
      });

      document.addEventListener("click", function(e){
          if (!searchBox.contains(e.target) && !suggestionBox.contains(e.target)) {
              suggestionBox.style.display = "none";
          }
      });
  }
  
  function onModeChange() {
      activeIndex = -1;
      searchBox.value = "";
      entityIdField.value = "";
      suggestionBox.innerHTML = "";
      suggestionBox.style.display = "none";

      setTimeout(() => searchBox.focus(), 0);
  }

  // Enter key global navigation jumping between inputs
  document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;

      const active = document.activeElement;

      // Type -> Search
      if (active.id === "entity_type") {
          e.preventDefault();
          searchBox.focus();
          return;
      }

      // Search -> Amount (only triggers if dropdown is closed/empty so it doesn't bypass selection)
      if (active.id === "searchBox") {
          if (suggestionBox.style.display === "none" || suggestionBox.innerHTML === "") {
              e.preventDefault();
              document.getElementById("amount").focus();
          }
          return;
      }

      // Amount -> Note
      if (active.id === "amount") {
          e.preventDefault();
          document.getElementById("note").focus();
          return;
      }

      // Note -> Submit
      if (active.id === "note") {
          e.preventDefault();
          if (adjustmentSubmitting) return;
          document.getElementById("adjust-form").requestSubmit();
          return;
      }
  });

  // Prevent submission without selection or double submissions
  let adjustmentSubmitting = false;

  document.getElementById("adjust-form").addEventListener("submit", function(e) {
      const selectedId = document.getElementById("entity_id").value;
      
      if (!selectedId) {
          e.preventDefault();
          alert("Please select a supplier or customer from the list before submitting.");
          searchBox.focus();
          return false;
      }

      if (adjustmentSubmitting) {
          e.preventDefault();
          return false;
      }

      adjustmentSubmitting = true;

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Applying...";

      return true;
  });

  document.addEventListener("DOMContentLoaded", function() {
      // Ensure defaults are set securely on load
      entityTypeField.value = "customer";
      
      setupAutocomplete();

      // Clear search and ensure initial pointer goes to search box
      searchBox.value = "";
      setTimeout(() => {
          searchBox.focus();
      }, 100);
  });
</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
    /* ========================================================
       TOKENS
       ======================================================== */
    :root{
        --ink:        #1B2A4A;
        --ink-soft:    #3B4C6E;
        --paper:      #F6F2E8;
        --paper-raised:#FFFDF8;
        --rule:       #E1D6BC;
        --brass:      #A97F45;
        --brass-deep: #8C6835;
        --brass-tint: #EFE1C6;
        --success:    #2F6F4E;
        --success-bg: #E7F1EA;
        --error:      #AD3B2B;
        --error-bg:   #F7E7E2;
        --muted:      #7A7563;
        --shadow-lg:  0 24px 48px -18px rgba(27,42,74,0.28);
        --shadow-sm:  0 2px 6px rgba(27,42,74,0.08);
    }

    @media (prefers-reduced-motion: reduce){
        *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }

    /* ========================================================
       PAGE
       ======================================================== */
    body{
        background:
            radial-gradient(circle at 12% 8%, rgba(169,127,69,0.10), transparent 45%),
            radial-gradient(circle at 88% 92%, rgba(27,42,74,0.08), transparent 50%),
            var(--paper);
        background-attachment: fixed;
        font-family: 'Inter', -apple-system, sans-serif;
        color: var(--ink);
    }

    .supplier-wrap{
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
    }

    .eyebrow{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        font-family:'IBM Plex Mono', monospace;
        font-size:11px;
        letter-spacing:.16em;
        text-transform:uppercase;
        color: var(--brass-deep);
        margin-bottom:10px;
    }
    .eyebrow::before, .eyebrow::after{
        content:"";
        height:1px;
        width:28px;
        background: var(--brass);
        opacity:.55;
    }

    .page-title{
        font-family:'Fraunces', serif;
        font-weight:600;
        font-size: 32px;
        letter-spacing: -0.01em;
        color: var(--ink);
        text-align:center;
        margin: 0 0 34px;
    }

    /* ========================================================
       LEDGER CARD
       ======================================================== */
    .supplier-card{
        position:relative;
        background: var(--paper-raised);
        background-image: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 47px,
            var(--rule) 48px
        );
        background-position: 0 108px;
        border-radius: 4px;
        padding: 40px 40px 34px;
        box-shadow: var(--shadow-lg);
        border: 1px solid rgba(27,42,74,0.07);
        animation: riseIn .5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes riseIn{
        from{ opacity:0; transform: translateY(14px); }
        to{ opacity:1; transform: translateY(0); }
    }

    /* brass corner tab, like a ledger index tab */
    .ledger-tab{
        position:absolute;
        top: -14px;
        left: 36px;
        width: 46px;
        height: 28px;
        background: linear-gradient(160deg, var(--brass), var(--brass-deep));
        border-radius: 3px;
        box-shadow: var(--shadow-sm);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:14px;
    }

    /* perforated left edge, echoes a torn ledger sheet */
    .supplier-card::before{
        content:"";
        position:absolute;
        left: 0;
        top: 18px;
        bottom: 18px;
        width: 1px;
        background-image: radial-gradient(circle, var(--rule) 1.5px, transparent 1.6px);
        background-size: 1px 10px;
        background-repeat: repeat-y;
    }

    /* ========================================================
       FORM
       ======================================================== */
    .form-group{
        position: relative;
        margin-bottom: 26px;
    }

    .field-row{
        display:flex;
        gap: 16px;
    }
    .field-row .form-group{ flex:1; }

    label{
        display:flex;
        align-items:center;
        gap:7px;
        font-weight:600;
        font-size: 12.5px;
        letter-spacing:.03em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 8px;
    }
    label .req{ color: var(--brass-deep); font-weight:700; }
    label .opt{
        font-weight:500;
        text-transform:none;
        color: var(--muted);
        letter-spacing:0;
        font-size: 11.5px;
    }

    .input-shell{
        position:relative;
        display:flex;
        align-items:center;
    }

    .input-icon{
        position:absolute;
        left:14px;
        font-size:15px;
        opacity:.55;
        pointer-events:none;
    }

    .input-field{
        width:100%;
        padding: 13px 14px 13px 40px;
        border-radius: 10px;
        border: 1.5px solid var(--rule);
        background: var(--paper);
        outline:none;
        font-family:'Inter', sans-serif;
        font-size: 15px;
        color: var(--ink);
        transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .input-field::placeholder{ color: #A79F87; }

    .input-field:focus{
        border-color: var(--brass);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(169,127,69,0.14);
    }

    /* currency-style opening balance field */
    #supplier_name{ padding-left: 40px; }
    input[name="opening_balance"]{
        padding-left: 34px;
        font-family:'IBM Plex Mono', monospace;
        font-weight:600;
        letter-spacing: .02em;
    }
    .currency-prefix{
        position:absolute;
        left:14px;
        font-family:'IBM Plex Mono', monospace;
        font-weight:600;
        color: var(--ink-soft);
        opacity:.7;
        pointer-events:none;
    }

    .field-hint{
        margin-top:6px;
        font-size:12px;
        color: var(--muted);
    }

    /* name-field validation state */
    .input-field.is-checking{ border-color: #C9BE97; }
    .input-field.is-valid{ border-color: var(--success); background:#fff; }
    .input-field.is-duplicate{ border-color: var(--error); background:#fff; }

    .name-status{
        display:flex;
        align-items:center;
        gap:7px;
        margin-top:8px;
        font-size:13px;
        font-weight:600;
        max-height:0;
        overflow:hidden;
        opacity:0;
        transition: max-height .22s ease, opacity .18s ease, margin-top .22s ease;
    }
    .name-status.show{
        max-height: 40px;
        opacity:1;
    }
    .name-status.checking{ color:#8A7F5A; }
    .name-status.valid{ color: var(--success); }
    .name-status.duplicate{ color: var(--error); }

    .status-dot{
        width:7px; height:7px; border-radius:50%;
        background: currentColor;
        flex:none;
    }
    .status-dot.checking{ animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse{
        0%,100%{ opacity:1; transform:scale(1); }
        50%{ opacity:.4; transform:scale(.7); }
    }

    /* ========================================================
       SUBMIT
       ======================================================== */
    .btn-submit{
        position:relative;
        width:100%;
        margin-top: 8px;
        padding: 15px 18px;
        border:none;
        border-radius: 10px;
        background: linear-gradient(160deg, #23365E, var(--ink));
        color: var(--paper-raised);
        font-family:'Inter', sans-serif;
        font-size: 15.5px;
        font-weight:700;
        letter-spacing:.02em;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:9px;
        box-shadow: var(--shadow-sm);
        transition: transform .18s ease, box-shadow .18s ease, background .2s ease;
    }
    .btn-submit:hover:not(:disabled){
        transform: translateY(-2px);
        box-shadow: 0 10px 24px -8px rgba(27,42,74,0.45);
    }
    .btn-submit:active:not(:disabled){ transform: translateY(0); }
    .btn-submit:disabled{
        cursor:not-allowed;
        opacity:.55;
        transform:none;
        box-shadow:none;
    }
    .btn-submit:focus-visible{
        outline: 3px solid var(--brass);
        outline-offset: 2px;
    }

    .spinner{
        width:15px; height:15px;
        border-radius:50%;
        border: 2px solid rgba(246,242,232,0.35);
        border-top-color: var(--paper-raised);
        animation: spin .7s linear infinite;
        display:none;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }
    .btn-submit.is-loading .spinner{ display:inline-block; }
    .btn-submit.is-loading .btn-label{ display:none; }

    .footnote{
        text-align:center;
        margin-top:16px;
        font-size:12px;
        color: var(--muted);
    }

    @media (max-width: 480px){
        .supplier-card{ padding: 32px 22px 28px; }
        .field-row{ flex-direction:column; gap:0; }
        .page-title{ font-size:26px; }
    }
</style>

<div class="supplier-wrap">

    <div class="eyebrow">Supplier Ledger</div>
    <h2 class="page-title">Add New Supplier</h2>

    <div class="supplier-card">
        <div class="ledger-tab">🧾</div>

        <form method="POST" id="supplierForm" novalidate>

            <div class="form-group">
                <label for="supplier_name">Name <span class="req">*</span></label>
                <div class="input-shell">
                    <span class="input-icon">🏷️</span>
                    <input type="text"
                           id="supplier_name"
                           name="name"
                           class="input-field"
                           placeholder="e.g. Sundar Traders"
                           autocomplete="off"
                           required>
                </div>
                <div id="name-status" class="name-status">
                    <span class="status-dot"></span>
                    <span class="status-text"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="supplier_phone">Phone <span class="opt">optional</span></label>
                <div class="input-shell">
                    <span class="input-icon">📞</span>
                    <input type="tel"
                           id="supplier_phone"
                           name="phone"
                           class="input-field"
                           placeholder="10-digit mobile number"
                           inputmode="numeric"
                           maxlength="10">
                </div>
            </div>

            <div class="form-group">
                <label for="supplier_address">Address <span class="opt">optional</span></label>
                <div class="input-shell">
                    <span class="input-icon">📍</span>
                    <input type="text"
                           id="supplier_address"
                           name="address"
                           class="input-field"
                           placeholder="Shop / street / city">
                </div>
            </div>

            <div class="form-group">
                <label for="opening_balance">Opening Balance</label>
                <div class="input-shell">
                    <span class="currency-prefix">₹</span>
                    <input type="number"
                           id="opening_balance"
                           step="0.01"
                           name="opening_balance"
                           value="0"
                           class="input-field">
                </div>
                <div class="field-hint">Amount already owed to or by this supplier, if any.</div>
            </div>

            <button type="submit" id="saveBtn" class="btn-submit">
                <span class="spinner"></span>
                <span class="btn-label">💾 Save Supplier</span>
            </button>

        </form>
    </div>

    <div class="footnote">Press Enter to move between fields · Enter on Opening Balance saves</div>
</div>

<script>
// ENTER KEY → move to next field, submit only on button
const supplierName = document.getElementById("supplier_name");
const supplierPhone = document.getElementById("supplier_phone");
const nameStatus = document.getElementById("name-status");
const nameStatusText = nameStatus.querySelector(".status-text");
const nameStatusDot = nameStatus.querySelector(".status-dot");
const saveBtn = document.getElementById("saveBtn");
const supplierForm = document.getElementById("supplierForm");

let supplierSubmitting = false;

document.addEventListener("keydown", function (e) {

    if (e.key !== "Enter") return;

    const active = document.activeElement;

    // Allow submit only if Enter is on button
    if (active.tagName === "BUTTON" && active.type === "submit") {
        return;
    }

    e.preventDefault();

    const focusable = Array.from(
        document.querySelectorAll(
            "input:not([type=hidden]), select, textarea, button"
        )
    ).filter(el => !el.disabled && el.offsetParent !== null);

    const index = focusable.indexOf(active);

    // Opening Balance -> Submit
    if (active.name === "opening_balance") {

        if (!supplierSubmitting && !saveBtn.disabled) {
            supplierForm.requestSubmit();
        }
        return;
    }

    // Move to next field
    if (index > -1 && index < focusable.length - 1) {
        focusable[index + 1].focus();
    }
});

// Prevent double submit + loading state
supplierForm.addEventListener("submit", function (e) {

    if (supplierSubmitting) {
        e.preventDefault();
        return false;
    }

    supplierSubmitting = true;

    saveBtn.disabled = true;
    saveBtn.classList.add("is-loading");
});

// Digits-only, capped phone input
supplierPhone.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "").slice(0, 10);
});

// Title-case as you type
supplierName.addEventListener("input", function () {
    this.value = this.value.replace(/\b\w/g, c => c.toUpperCase());
    // typing again after a resolved check clears the stale state
    if (nameStatus.classList.contains("show")) {
        setStatus("checking", "Checking availability…");
    }
});

function setStatus(kind, text) {
    nameStatus.classList.remove("checking", "valid", "duplicate");
    nameStatusDot.classList.remove("checking");
    supplierName.classList.remove("is-checking", "is-valid", "is-duplicate");

    if (!kind) {
        nameStatus.classList.remove("show");
        return;
    }

    nameStatus.classList.add("show", kind);
    nameStatusText.textContent = text;
    supplierName.classList.add(
        kind === "checking" ? "is-checking" : kind === "valid" ? "is-valid" : "is-duplicate"
    );
    if (kind === "checking") nameStatusDot.classList.add("checking");
}

// Duplicate supplier check
supplierName.addEventListener("blur", function () {

    const name = this.value.trim();

    if (!name) {
        setStatus(null);
        saveBtn.disabled = false;
        return;
    }

    setStatus("checking", "Checking availability…");

    fetch(`/api/check_supplier?name=${encodeURIComponent(name)}`)
        .then(response => response.json())
        .then(data => {

            if (data.exists) {
                setStatus("duplicate", "Supplier already present");
                saveBtn.disabled = true;
            } else {
                setStatus("valid", "Name is available");
                saveBtn.disabled = false;
            }

        })
        .catch(() => {
            setStatus(null);
            saveBtn.disabled = false;
        });
});
</script>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<style>
.table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.table th,
.table td{
    padding:10px;
    text-align:left;
    border-bottom:1px solid #ddd;
}

.table th:nth-child(1),
.table td:nth-child(1){
    width:80px;
}

.table th:nth-child(2),
.table td:nth-child(2){
    width:250px;
}

.table th:nth-child(3),
.table td:nth-child(3){
    width:150px;
}

.table th:nth-child(5),
.table td:nth-child(5){
    width:120px;
}
.filter-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.filter-row{
    display:flex;
    gap:16px;
    align-items:flex-end;
    flex-wrap:wrap;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    margin-bottom:6px;
    font-weight:600;
}

.field select,
.field input{
    height:44px;
    min-width:180px;
}

.person-field{
    flex:1;
    min-width:320px;
}

.btn-field{
    align-self:flex-end;
}

.btn-field button{
    height:44px;
    min-width:120px;
}
</style>

<h2>Edit Receipts / Payments</h2>

<div class="filter-card">
    <div class="filter-row">

        <div class="field">
            <label><strong>Transaction Type</strong></label>
            <select id="tx-type" class="input-field">
                <option value="receipt">Receipt</option>
                <option value="payment">Payment</option>
            </select>
        </div>

        <div class="field">
            <label><strong>Entity</strong></label>
            <select id="entity-type" class="input-field">
                <option value="customer">Customer</option>
                <option value="supplier">Supplier</option>
            </select>
        </div>

        <div class="field person-field">
            <label><strong>Person (ID / Name)</strong></label>
            <input
                type="text"
                id="person-search"
                class="input-field"
                list="person-list"
                placeholder="Search customer or supplier">

            <datalist id="person-list"></datalist>
        </div>

        <div class="field btn-field">
            <button id="load-transactions" class="btn btn-primary">
                Load
            </button>
        </div>

    </div>
</div>

<p class="small-note">
  Choose the type (receipt/payment), choose customer or supplier,
  then select person and click Load to show transactions for editing.
</p>

<hr>
<hr>

<div id="tx-list-wrap">
  <h3>Transactions</h3>
  <div id="tx-list">No transactions loaded.</div>
</div>

<!-- Edit panel (hidden until editing) -->
<div id="edit-panel" style="display:none; margin-top:18px; max-width:700px; border:1px solid #ddd; padding:12px; border-radius:8px;">
  <h4>Edit Transaction <span id="edit-tx-id"></span></h4>

  <form id="edit-form">
    <input type="hidden" name="tx_id" id="edit-tx-id-input">

    <div style="display:flex; gap:12px; flex-wrap:wrap;">
      <div style="flex:1">
        <label>Amount</label><br>
        <input name="amount" id="edit-amount" type="number" step="0.01" class="input-field" required>
      </div>

      <div style="flex:1">
        <label>Date</label><br>
        <input name="tx_date" id="edit-date" type="datetime-local" class="input-field">
      </div>

      <div style="flex:1 1 100%">
        <label>Note</label><br>
        <input name="note" id="edit-note" type="text" class="input-field">
      </div>
    </div>

    <div style="margin-top:10px;">
      <button type="button" id="save-edit" class="btn btn-primary">Save</button>
      <button type="button" id="cancel-edit" class="btn btn-small">Cancel</button>
    </div>

    <div id="edit-result" style="margin-top:10px;"></div>
  </form>
</div>

<script>
  function by(id){ 
    return document.getElementById(id); 
  }

  const allCustomers = JSON.parse('{{ customers|tojson|safe }}');
  const allSuppliers = JSON.parse('{{ suppliers|tojson|safe }}');

  // Load transactions
  by('load-transactions').addEventListener('click', function(){

    const txType = by('tx-type').value;
    const entityType = by('entity-type').value;
    const searchValue = by('person-search').value.trim();

    if (!searchValue) {
        alert('Choose a person');
        return;
    }
    
    const data =
        entityType === 'customer'
            ? allCustomers
            : allSuppliers;
    
    const person = data.find(item =>
        searchValue === `${item.name} (ID: ${item.id})`
    );
    
    if (!person) {
        alert('Please select a valid person from the list');
        return;
    }
    
    const entityId = person.id;

    const wrap = by('tx-list');
    wrap.innerHTML = 'Loading...';

    const params = new URLSearchParams({
      tx_type: txType,
      entity_type: entityType,
      entity_id: entityId
    });

    fetch('/transactions/list?' + params.toString())
      .then(r => r.json())
      .then(data => {

        if (data.error) {
          wrap.innerText = 'Error: ' + data.error;
          return;
        }

        const txs = data.transactions || [];

        if (txs.length === 0) {
          wrap.innerHTML =
            '<div>No transactions found for this person and type.</div>';
          return;
        }

        const tbl = document.createElement('table');
        tbl.className = 'table';
        tbl.style.width = '100%';

        tbl.innerHTML = `
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Action</th>
            </tr>
          </thead>
        `;

        const tb = document.createElement('tbody');

        txs.forEach(t => {

          const tr = document.createElement('tr');

          const date = t.tx_date
            ? new Date(t.tx_date).toLocaleDateString('en-GB')
            : '';

          tr.innerHTML = `
            <td>${t.tx_id}</td>
            <td>${date}</td>
            <td>${(t.amount || 0).toFixed(2)}</td>
            <td>${t.note || ''}</td>
            <td>
              <button data-tx="${t.tx_id}"
                      class="btn btn-small edit-tx-btn">
                Edit
              </button>
            </td>
          `;

          tb.appendChild(tr);
        });

        tbl.appendChild(tb);

        wrap.innerHTML = '';
        wrap.appendChild(tbl);

        document.querySelectorAll('.edit-tx-btn').forEach(btn => {
          btn.addEventListener('click', function(){
            openEditForm(this.dataset.tx);
          });
        });

      })
      .catch(err => {
        wrap.innerText = 'Request failed: ' + err;
      });
  });
  

  function populatePersonList() {
      const entityType = by('entity-type').value;
      const list = by('person-list');

      list.innerHTML = '';

      const data =
          entityType === 'customer'
              ? allCustomers
              : allSuppliers;

      data.forEach(item => {
          const option = document.createElement('option');
          option.value = `${item.name} (ID: ${item.id})`;
          list.appendChild(option);
      });
  }

  by('entity-type').addEventListener('change', function(){
      by('person-search').value = '';
      populatePersonList();
  });

  populatePersonList();
  // open edit form for a tx id: fetch tx row and populate form
  function openEditForm(txid) {
    fetch('/transactions/edit/' + txid)
      .then(r => r.json())
      .then(data => {
        if (data.error) { alert('Error: '+data.error); return; }
        const tx = data.tx;
        by('edit-panel').style.display = 'block';
        by('edit-tx-id').innerText = '#' + tx.tx_id;
        by('edit-tx-id-input').value = tx.tx_id;
        by('edit-amount').value = (tx.amount || 0).toFixed(2);

        // parse ISO date to datetime-local format for input if present
        if (tx.tx_date) {
          const d = new Date(tx.tx_date);
          // format to yyyy-MM-ddTHH:mm (seconds optional)
          const pad = n => (n<10?'0':'')+n;
          const isoLocal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
          by('edit-date').value = isoLocal;
        } else {
          by('edit-date').value = '';
        }

        by('edit-note').value = tx.note || '';
        by('edit-result').innerText = '';
        window.scrollTo({ top: by('edit-panel').offsetTop - 20, behavior: 'smooth' });
      })
      .catch(err => { alert('Failed to load tx: '+err); });
  }

  // Cancel edit
  by('cancel-edit').addEventListener('click', function(){
    by('edit-panel').style.display = 'none';
  });

  // Save edit -> call POST JSON
  by('save-edit').addEventListener('click', function(){
    const txid = by('edit-tx-id-input').value;
    const amount = parseFloat(by('edit-amount').value || 0);
    const note = by('edit-note').value || '';
    const dateVal = by('edit-date').value; // in datetime-local format -> 'yyyy-MM-ddTHH:mm'
    // convert to ISO if present
    const tx_date = dateVal ? new Date(dateVal).toISOString() : null;

    const payload = { amount: amount, note: note, tx_date: tx_date };

    fetch('/transactions/edit/' + txid, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(j => {
      if (j.error) {
        by('edit-result').innerText = 'Error: ' + j.message || j.error;
        by('edit-result').style.color = 'red';
      } else {
        by('edit-result').innerText = 'Saved successfully.';
        by('edit-result').style.color = 'green';
        // reload transaction list for the same person to reflect changes
        setTimeout(()=> by('load-transactions').click(), 400);
      }
    })
    .catch(err=>{
      by('edit-result').innerText = 'Save failed: ' + err;
      by('edit-result').style.color = 'red';
    });
  });

</script>

{% endblock %}

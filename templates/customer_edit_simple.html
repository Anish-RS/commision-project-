{% extends "base.html" %}

{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
    --ink:#0F172A;
    --slate:#475569;
    --slate-soft:#94A3B8;
    --indigo:#4F46E5;
    --indigo-dark:#4338CA;
    --sky:#38BDF8;
    --mint:#10B981;
    --bg:#EEF2FA;
    --line:#E2E8F0;
    --card:#FFFFFF;
    --locked-bg:#F1F5F9;
}

.ledger-wrap{
    min-height:calc(100vh - 40px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
        radial-gradient(circle at 15% 10%, rgba(79,70,229,0.08), transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(56,189,248,0.10), transparent 40%),
        var(--bg);
    font-family:'Inter', -apple-system, sans-serif;
}

.edit-card{
    position:relative;
    width:100%;
    max-width:440px;
    margin:0 auto;
    background:var(--card);
    border-radius:20px;
    padding:32px 28px 28px;
    box-shadow:
        0 1px 2px rgba(15,23,42,0.04),
        0 20px 40px -12px rgba(15,23,42,0.14);
    border:1px solid var(--line);
    overflow:hidden;
}

/* signature: top ledger strip with perforation dots, evokes a receipt/statement */
.edit-card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    background:linear-gradient(90deg, var(--indigo), var(--sky));
}

.card-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    padding-bottom:20px;
    border-bottom:1px dashed var(--line);
}

.avatar-badge{
    flex:0 0 auto;
    width:48px;
    height:48px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--indigo), var(--sky));
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:0.5px;
    box-shadow:0 6px 14px rgba(79,70,229,0.30);
}

.header-text{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
}

.edit-title{
    margin:0;
    font-family:'Manrope', sans-serif;
    font-size:19px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-0.2px;
}

.edit-subtitle{
    margin:0;
    font-size:12.5px;
    color:var(--slate-soft);
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-label{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    font-weight:700;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:6px;
}

.form-label svg{
    width:12px;
    height:12px;
    opacity:0.55;
    flex-shrink:0;
}

.form-input{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:11px;
    background:#FAFBFF;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    transition:border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-sizing:border-box;
}

.form-input::placeholder{
    color:var(--slate-soft);
    font-weight:400;
}

.form-input:hover:not(:read-only){
    border-color:#C7D6F5;
}

.form-input:focus{
    outline:none;
    border-color:var(--indigo);
    background:#fff;
    box-shadow:0 0 0 4px rgba(79,70,229,0.12);
}

.field-wrap{
    position:relative;
}

.readonly-field{
    background:var(--locked-bg);
    color:var(--slate);
    font-weight:600;
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    letter-spacing:0.2px;
    padding-right:34px;
    cursor:default;
}

.lock-icon{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    color:var(--slate-soft);
    pointer-events:none;
}

.balance-field{
    color:var(--mint);
    font-weight:700;
}

.helper-note{
    margin:5px 2px 0;
    font-size:11px;
    color:var(--slate-soft);
    font-weight:500;
}

.update-btn{
    position:relative;
    margin-top:22px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    font-family:'Manrope', sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:0.2px;
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(135deg, var(--indigo), var(--indigo-dark));
    box-shadow:0 8px 18px -4px rgba(79,70,229,0.45);
    transition:transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}

.update-btn svg{
    width:16px;
    height:16px;
}

.update-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 12px 22px -4px rgba(79,70,229,0.55);
}

.update-btn:active{
    transform:translateY(0);
    filter:brightness(0.96);
}

.update-btn:focus-visible{
    outline:2px solid var(--indigo-dark);
    outline-offset:3px;
}

.form-input:focus-visible{
    outline:none;
}

@media(max-width:480px){
    .edit-card{
        padding:26px 20px 22px;
        border-radius:16px;
    }
    .form-grid{
        grid-template-columns:1fr;
    }
}

@media(prefers-reduced-motion:reduce){
    .update-btn, .form-input{
        transition:none;
    }
}
</style>

<div class="ledger-wrap">
<div class="edit-card">

    <div class="card-header">
        <div class="avatar-badge">{{ (customer.name or "?")[0]|upper }}</div>
        <div class="header-text">
            <h2 class="edit-title">Edit customer</h2>
            <p class="edit-subtitle">{{ customer.name or "Unnamed customer" }}</p>
        </div>
    </div>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>
                    Customer ID
                </label>
                <div class="field-wrap">
                    <input
                        type="text"
                        value="{{ customer.customer_id }}"
                        readonly
                        class="form-input readonly-field">
                    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Amount
                </label>
                <div class="field-wrap">
                    <input
                        type="text"
                        value="₹{{ '%.2f'|format(customer.balance or 0) }}"
                        readonly
                        class="form-input readonly-field balance-field">
                    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                </div>
            </div>

            <div class="form-group full">
                <label class="form-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.92z"/></svg>
                    Phone number
                </label>
                <input
                    type="tel"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                    placeholder="Enter phone number"
                    class="form-input">
            </div>

            <div class="form-group full">
                <label class="form-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Customer name
                </label>
                {% if customer.balance and customer.balance != 0 %}
                <div class="field-wrap">
                    <input
                        type="text"
                        value="{{ customer.name }}"
                        readonly
                        class="form-input readonly-field">
                    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                </div>
                <input type="hidden" name="name" value="{{ customer.name }}">
                <p class="helper-note">Name is locked while this customer has an outstanding balance.</p>
                {% else %}
                <input
                    type="text"
                    name="name"
                    value="{{ customer.name }}"
                    placeholder="Enter customer name"
                    required
                    class="form-input">
                {% endif %}
            </div>

        </div>

        <button type="submit" class="update-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Update customer
        </button>

    </form>

</div>
</div>

{% endblock %}

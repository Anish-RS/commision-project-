{% extends "base.html" %}

{% block content %}

<style>
.edit-card{
    max-width:420px;
    margin:10px auto;
    background:rgba(255,255,255,0.95);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 20px rgba(108,99,255,0.10);
    border-left:5px solid #7ec8ff;
}

.edit-title{
    margin:0 0 15px;
    text-align:center;
    font-size:24px;
    font-weight:700;
    color:#222;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-label{
    font-size:14px;
    font-weight:600;
    color:#444;
    margin-bottom:4px;
}

.form-input{
    width:100%;
    padding:9px 12px;
    border:2px solid #d9ecff;
    border-radius:10px;
    background:#f8fbff;
    font-size:14px;
    transition:0.2s;
    box-sizing:border-box;
}

.form-input:focus{
    outline:none;
    border-color:#7ec8ff;
    box-shadow:0 0 0 4px rgba(126,200,255,0.18);
}

.readonly-field{
    background:#eef3f8;
    color:#666;
    font-weight:700;
}

.update-btn{
    margin-top:15px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#64B5F6,#6C63FF);
    transition:0.2s;
}

.update-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(108,99,255,0.25);
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>

<div class="edit-card">

    <h2 class="edit-title"> Edit Customer</h2>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label">Customer ID</label>
                <input
                    type="text"
                    value="{{ customer.customer_id }}"
                    readonly
                    class="form-input readonly-field">
            </div>

            <div class="form-group">
                <label class="form-label">Amount</label>
                <input
                    type="text"
                    value="₹{{ '%.2f'|format(customer.balance or 0) }}"
                    readonly
                    class="form-input readonly-field">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input
                    type="text"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                    class="form-input">
            </div>

            <div class="form-group full">
                <label class="form-label">Customer Name</label>
                {% if customer.balance and customer.balance != 0 %}
                <input
                    type="text"
                    value="{{ customer.name }}"
                    readonly
                    class="form-input readonly-field">
                <input type="hidden" name="name" value="{{ customer.name }}">
                {% else %}
                <input
                    type="text"
                    name="name"
                    value="{{ customer.name }}"
                    required
                    class="form-input">
                {% endif %}
            </div>

        </div>

        <button type="submit" class="update-btn">
            💾 Update Customer
        </button>

    </form>

</div>

{% endblock %}

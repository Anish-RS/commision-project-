{% extends "base.html" %}
{% block content %}

<style>
.edit-container{
    max-width:1100px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.page-title{
    margin-bottom:20px;
    font-size:28px;
    font-weight:700;
    text-align:center;
    color:#1f2937;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.field-group{
    display:flex;
    flex-direction:column;
}

.field-group label{
    font-weight:600;
    margin-bottom:8px;
    color:#374151;
}

.field-group input{
    height:40px;
}

input,
select{
    width:100%;
    padding:8px 10px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.section-title{
    margin:30px 0 15px;
    font-size:24px;
    font-weight:700;
}

#lines-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

#lines-table th{
    background:#f3f4f6;
    padding:14px;
    text-align:center;
    font-size:18px;
}

#lines-table td{
    padding:8px;
}

#lines-table input{
    margin:0;
}

#lines-table tr:nth-child(even){
    background:#fafafa;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:25px;
}

.summary-grid input{
    height:45px;
}

.balance-card{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-top:25px;
}

.balance-card label{
    font-weight:600;
    display:block;
    margin-bottom:6px;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.btn-primary:hover{
    opacity:.9;
}

.btn-add{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.remove-btn{
    background:#dc2626;
    color:white;
    border:none;
    width:40px;
    height:40px;
    border-radius:8px;
    cursor:pointer;
}

.readonly{
    background:#f3f4f6;
}

.customer-suggestions{
    position:absolute;
    background:white;
    border:1px solid #d1d5db;
    max-height:200px;
    overflow-y:auto;
    width:250px;
    z-index:9999;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.customer-suggestions div:hover{
    background:#f3f4f6;
}
    
</style>

<div class="edit-container">

<h2 class="page-title">
    Edit Supplier Bill #{{ bill.bill_id }}
</h2>

<form method="POST" oninput="recalcTotals()">

    <div style="display:flex; gap:20px; align-items:end; flex-wrap:wrap; margin-bottom:20px;">

        <div class="field-group" style="width:180px;">
            <label>Supplier ID</label>
            <input type="text"
                   value="{{ bill.supplier_id }}"
                   readonly
                   class="readonly">
        </div>

        <div class="field-group" style="width:300px;">
            <label>Supplier Name</label>
            <input type="text"
                   value="{{ bill.supplier_name }}"
                   readonly
                   class="readonly">
        </div>

        <div class="field-group" style="width:180px;">
            <label>Bill Date</label>
            <input type="text"
                   value="{{ bill.bill_date.strftime('%d-%m-%Y') if bill.bill_date else '' }}"
                   readonly
                   class="readonly">
        </div>

    </div>

    <input type="hidden"
           name="bill_date"
           value="{{ bill.bill_date }}">
   
   
   <h3 class="section-title">Line Items</h3>
    <table id="lines-table" border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
               <th>Customer ID</th>
               <th>Customer Name</th>
               <th>Rate</th>
               <th>Quantity</th>
               <th>Amount</th>

                <th></th>
            </tr>
        </thead>

        <tbody id="lines-body">

          {% for it in items %}
            <tr>
                <td>
                   <input type="text"
                           name="customer_id[]"
                           class="customer-id"
                           value="{{ it.customer_id }}"
                           autocomplete="off"
                           oninput="showCustomerSuggestions(this)">
                    <div class="customer-suggestions"></div>
               </td>
               
               <td>
                   <input type="text"
                           class="customer-name"
                           value="{{ it.customer_name }}"
                           autocomplete="off"
                           oninput="showCustomerSuggestions(this)">
               </td>
                <td>
                    <input type="number" step="0.01" name="rate[]" class="rate"
                        value="{{ it.rate }}" oninput="recalcTotals()">
                </td>
                <td>
                    <input type="number" step="0.01" name="quantity[]" class="qty"
                        value="{{ it.quantity }}" oninput="recalcTotals()">

                </td>
               
                <td>
                    <input type="number" step="0.01" name="amount[]" class="amount" value="{{ it.amount }}" readonly>
                </td>
                <td>
                    <button type="button"         class="remove-btn"         onclick="removeLine(this)">     ✕ </button>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

    <button type="button"
              class="btn-add"
              onclick="addLine()">
          + Add Line
      </button>

    <br><br>

    <div class="summary-grid">
    
        <div class="field-group">
            <label>Commission</label>
            <input type="text"
               name="commission"
               id="commission"
               value="{{ bill.commission }}">
        </div>
    
        <div class="field-group">
            <label>Labour</label>
            <input type="number"
                   step="0.01"
                   name="labour"
                   id="labour"
                   value="{{ bill.labour }}">
        </div>
    
        <div class="field-group">
            <label>Transport</label>
            <input type="number"
                   step="0.01"
                   name="transport"
                   id="transport"
                   value="{{ bill.transport }}">
        </div>
    
        <div class="field-group">
            <label>Paid</label>
            <input type="number"
                   step="0.01"
                   name="paid"
                   id="paid"
                   value="{{ bill.paid }}">
        </div>
    
    </div>

    <div class="balance-card">

        <!-- bill.old_balance is SIGNED. Convert to ABS for UI display -->
        {% set disp_old = bill.old_balance * -1 if bill.old_balance < 0 else bill.old_balance %}

        <label><b>Old Supplier Balance:</b></label>
        <input type="number" id="old_balance" readonly value="{{ disp_old|float }}">
        <br><br>

        <label><b>New Total (Resulting Supplier Balance stored):</b></label>
        <input type="number" id="new_total" name="new_total" readonly style="background:#eee">

    </div>

    <!-- hidden fields for backend -->
    <input type="hidden" id="total_amount" name="total_amount">
    <input type="hidden" id="balance" name="balance">

    <br>
    <button type="submit" class="btn-primary">
        Save Changes
    </button>
</form>

<script>

const allCustomers = [
{% for c in customers %}
{
    id: "{{ c.customer_id }}",
    name: "{{ c.name }}"
},
{% endfor %}
];

function addLine() {

    const body = document.getElementById('lines-body');

    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>
            <input type="text"
                   name="customer_id[]"
                   class="customer-id"
                   autocomplete="off"
                   oninput="showCustomerSuggestions(this)">
            <div class="customer-suggestions"></div>
        </td>

        <td>
            <input type="text"
                   class="customer-name"
                   name="customer_name[]">
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="rate[]"
                   class="rate"
                   oninput="recalcTotals()">
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="quantity[]"
                   class="qty"
                   oninput="recalcTotals()">
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="amount[]"
                   class="amount"
                   readonly>
        </td>

        <td>
            <button type="button"
                    class="remove-btn"
                    onclick="removeLine(this)">
                ✕
            </button>
        </td>
    `;

    body.appendChild(tr);

    recalcTotals();
}    

    function showCustomerSuggestions(input) {

        const row = input.closest("tr");
    
        let box = row.querySelector(".customer-suggestions");
    
        if (!box) {
            box = document.createElement("div");
            box.className = "customer-suggestions";
            input.parentNode.appendChild(box);
        }
    
        const text = input.value.toLowerCase().trim();
    
        box.innerHTML = "";
    
        if (!text) {
            box.style.display = "none";
            return;
        }
    
        const matches = allCustomers.filter(c =>
            c.id.toString().includes(text) ||
            c.name.toLowerCase().includes(text)
        );
    
        matches.slice(0,20).forEach(c => {
    
            const div = document.createElement("div");
    
            div.style.padding = "8px";
            div.style.cursor = "pointer";
            div.innerText = `${c.id} - ${c.name}`;
    
            div.onclick = function() {
    
                row.querySelector(".customer-id").value = c.id;
                row.querySelector(".customer-name").value = c.name;
    
                box.style.display = "none";
            };
    
            box.appendChild(div);
        });
    
        box.style.display =
            matches.length ? "block" : "none";
    }
    
    function removeLine(btn) {
    const body = document.getElementById('lines-body');
    if (body.rows.length > 1) {
        body.removeChild(btn.closest('tr'));
        recalcTotals();
    }
}

function recalcTotals() {
    const rows = document.querySelectorAll('#lines-body tr');
    let total = 0;

    rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.qty')?.value) || 0;
        const rate = parseFloat(row.querySelector('.rate')?.value) || 0;
        const amount = qty * rate;

        row.querySelector('.amount').value = amount.toFixed(2);
        total += amount;
    });

    const commissionInput =
        document.getElementById('commission').value.trim();
    
    let commission = 0;
    
    if (commissionInput.endsWith('%')) {
    
        const pct =
            parseFloat(commissionInput.replace('%', '')) || 0;
    
        commission = total * pct / 100;
    
    } else {
    
        commission =
            parseFloat(commissionInput) || 0;
    }
    const labour = parseFloat(document.getElementById('labour').value) || 0;
    const transport = parseFloat(document.getElementById('transport').value) || 0;
    const paid = parseFloat(document.getElementById('paid').value) || 0;

    const bill_balance = total - commission - labour - transport - paid;

    document.getElementById('total_amount').value = total.toFixed(2);

    const old_abs = parseFloat(document.getElementById("old_balance").value) || 0;
    const old_signed = -old_abs;

    const new_total_positive = Math.abs(old_signed) + bill_balance;
    const new_signed_balance = -new_total_positive;

    document.getElementById("new_total").value = new_signed_balance.toFixed(2);
    document.getElementById("balance").value = new_signed_balance.toFixed(2);
}

recalcTotals();
</script>

{% endblock %}

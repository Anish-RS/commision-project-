{% extends "base.html" %}
{% block content %}

<style>
.edit-container{
    max-width:1400px;
    margin:20px auto;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.page-title{
    margin-bottom:30px;
    font-size:38px;
    font-weight:700;
    color:#1f2937;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.field-group{
    display:flex;
    flex-direction:column;
}

.field-group label{
    font-weight:600;
    margin-bottom:8px;
    color:#374151;
}

.field-group input{
    height:45px;
}

input,
select{
    width:100%;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

.section-title{
    margin:30px 0 15px;
    font-size:24px;
    font-weight:700;
}

#lines-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
}

#lines-table th{
    background:#f3f4f6;
    padding:14px;
    text-align:center;
    font-size:18px;
}

#lines-table td{
    padding:8px;
}

#lines-table input{
    margin:0;
}

#lines-table tr:nth-child(even){
    background:#fafafa;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:25px;
}

.summary-grid input{
    height:45px;
}

.balance-card{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:20px;
    margin-top:25px;
}

.balance-card label{
    font-weight:600;
    display:block;
    margin-bottom:6px;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.btn-primary:hover{
    opacity:.9;
}

.btn-add{
    background:#16a34a;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.remove-btn{
    background:#dc2626;
    color:white;
    border:none;
    width:40px;
    height:40px;
    border-radius:8px;
    cursor:pointer;
}

.readonly{
    background:#f3f4f6;
}
</style>

<div class="edit-container">

<h2 class="page-title">
    Edit Supplier Bill #{{ bill.bill_id }}
</h2>

<form method="POST" oninput="recalcTotals()">

   <div class="field-group">
          <label>Supplier ID</label>
          <input type="text"
                 value="{{ bill.supplier_id }}"
                 readonly
                 class="readonly">
      </div>
      
      <div class="field-group">
          <label>Supplier Name</label>
          <input type="text"
                 value="{{ bill.supplier_name }}"
                 readonly
                 class="readonly">
      </div>
   
    </div>
    
   <div class="field-group" style="max-width:300px;">
          <label>Bill Date</label>
          <input type="text"
                 value="{{ bill.bill_date }}"
                 readonly
                 class="readonly">
      </div>
      
      <input type="hidden"
             name="bill_date"
             value="{{ bill.bill_date }}">
   </div>
   
   <h3 class="section-title">Line Items</h3>
    <table id="lines-table" border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
               <th>Customer ID</th>
               <th>Customer Name</th>
               <th>Rate</th>
               <th>Quantity</th>
               <th>Amount</th>

                <th></th>
            </tr>
        </thead>

        <tbody id="lines-body">

          {% for it in items %}
            <tr>
                <td>
                   <input type="number"
                      name="customer_id[]"
                      value="{{ it.customer_id }}"
                      readonly>
               </td>
               
               <td>
                   <input type="text"
                          value="{{ it.customer_name }}"
                          readonly>
               </td>
                <td>
                    <input type="number" step="0.01" name="rate[]" class="rate"
                        value="{{ it.rate }}" oninput="recalcTotals()">
                </td>
                <td>
                    <input type="number" step="0.01" name="quantity[]" class="qty"
                        value="{{ it.quantity }}" oninput="recalcTotals()">

                </td>
               
                <td>
                    <input type="number" step="0.01" name="amount[]" class="amount" value="{{ it.amount }}" readonly>
                </td>
                <td>
                    <button type="button"         class="remove-btn"         onclick="removeLine(this)">     ✕ </button>
                </td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

    <button type="button"
              class="btn-add"
              onclick="addLine()">
          + Add Line
      </button>

    <br><br>

    <div class="summary-grid">
        <input type="number" step="0.01" name="commission" id="commission"
               placeholder="Commission" value="{{ bill.commission }}">
        <input type="number" step="0.01" name="labour" id="labour"
               placeholder="Labour" value="{{ bill.labour }}">
        <input type="number" step="0.01" name="transport" id="transport"
               placeholder="Transport" value="{{ bill.transport }}">
        <input type="number" step="0.01" name="paid" id="paid"
               placeholder="Paid" value="{{ bill.paid }}">
    </div>

    <div class="balance-card">

        <!-- bill.old_balance is SIGNED. Convert to ABS for UI display -->
        {% set disp_old = bill.old_balance * -1 if bill.old_balance < 0 else bill.old_balance %}

        <label><b>Old Supplier Balance:</b></label>
        <input type="number" id="old_balance" readonly value="{{ disp_old|float }}">
        <br><br>

        <label><b>New Total (Resulting Supplier Balance stored):</b></label>
        <input type="number" id="new_total" name="new_total" readonly style="background:#eee">

    </div>

    <!-- hidden fields for backend -->
    <input type="hidden" id="total_amount" name="total_amount">
    <input type="hidden" id="balance" name="balance">

    <br>
    <button type="submit" class="btn-primary">
       Save Changes
   </button>
   
   </div>
</form>

<script>
function addLine() {
    const body = document.getElementById('lines-body');
    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td><input type="number" name="customer_id[]" required></td>
        <td><input type="number" step="0.01" name="rate[]" class="rate" oninput="recalcTotals()"></td>
        <td><input type="number" step="0.01" name="quantity[]" class="qty" oninput="recalcTotals()"></td>
        <td><input type="number" step="0.01" name="amount[]" class="amount" readonly></td>
        <td><button type="button"
                 class="remove-btn"
                 onclick="removeLine(this)">
             ✕
         </button></td>
    `;

    body.appendChild(tr);
}

function removeLine(btn) {
    const body = document.getElementById('lines-body');
    if (body.rows.length > 1) {
        body.removeChild(btn.closest('tr'));
        recalcTotals();
    }
}

function recalcTotals() {
    const rows = document.querySelectorAll('#lines-body tr');
    let total = 0;

    rows.forEach(row => {
        const qty = parseFloat(row.querySelector('.qty')?.value) || 0;
        const rate = parseFloat(row.querySelector('.rate')?.value) || 0;
        const amount = qty * rate;

        row.querySelector('.amount').value = amount.toFixed(2);
        total += amount;
    });

    const commission = parseFloat(document.getElementById('commission').value) || 0;
    const labour = parseFloat(document.getElementById('labour').value) || 0;
    const transport = parseFloat(document.getElementById('transport').value) || 0;
    const paid = parseFloat(document.getElementById('paid').value) || 0;

    const bill_balance = total - commission - labour - transport - paid;

    document.getElementById('total_amount').value = total.toFixed(2);

    const old_abs = parseFloat(document.getElementById("old_balance").value) || 0;
    const old_signed = -old_abs;

    const new_total_positive = Math.abs(old_signed) + bill_balance;
    const new_signed_balance = -new_total_positive;

    document.getElementById("new_total").value = new_signed_balance.toFixed(2);
    document.getElementById("balance").value = new_signed_balance.toFixed(2);
}

recalcTotals();
</script>

{% endblock %}

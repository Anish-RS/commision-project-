{% extends "base.html" %}
{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
    --cream:#F6F1E4;
    --cream-deep:#EDE6D3;
    --navy:#16233A;
    --navy-soft:#28374F;
    --brass:#B08D57;
    --brass-light:#D4B483;
    --teal:#2F8F87;
    --bottle:#1F4B3F;
    --bottle-deep:#153229;
    --gold:#D4AF37;
    --ink:#1f2937;
    --line:rgba(22,35,58,.12);
}

@keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
}

.edit-container{
    max-width:1120px;
    margin:32px auto;
    background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.5));
    background-color:var(--cream);
    padding:36px 40px 44px;
    border-radius:20px;
    border:1px solid rgba(176,141,87,.25);
    box-shadow:0 1px 2px rgba(22,35,58,.06), 0 20px 48px -20px rgba(22,35,58,.28);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    position:relative;
    animation:riseIn .55s ease both;
}

.edit-container::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    pointer-events:none;
    background-image:
        repeating-linear-gradient(0deg, rgba(22,35,58,.035) 0 1px, transparent 1px 34px);
    opacity:.5;
}

.page-header{
    margin-bottom:28px;
    position:relative;
}

.page-title{
    font-family:'Fraunces',serif;
    font-size:32px;
    font-weight:700;
    text-align:center;
    color:var(--navy);
    letter-spacing:.2px;
    padding-bottom:18px;
    border-bottom:2px solid rgba(22,35,58,.1);
}

.page-title .bill-number{
    color:var(--brass);
    font-weight:700;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.field-group{
    display:flex;
    flex-direction:column;
}

.field-group label{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
    color:var(--navy-soft);
}

.field-group input{
    height:44px;
}

input,
select{
    width:100%;
    padding:9px 14px;
    border:1px solid rgba(22,35,58,.16);
    border-radius:999px;
    font-size:15px;
    font-family:'IBM Plex Mono',monospace;
    background:rgba(255,255,255,.85);
    color:var(--ink);
    box-sizing:border-box;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

input:focus,
select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(47,143,135,.18);
    background:#fff;
}

.section-title{
    margin:34px 0 16px;
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:12px;
}

.section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, var(--brass), transparent);
    opacity:.5;
}

#lines-table{
    width:100%;
    border-collapse:collapse;
    background:rgba(255,255,255,.7);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(22,35,58,.05);
}

#lines-table th{
    background:var(--navy);
    color:var(--cream);
    padding:13px 10px;
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
}

#lines-table td{
    padding:10px 8px;
    position:relative;
}

#lines-table input{
    margin:0;
    border-radius:10px;
    text-align:center;
    height:38px;
}

#lines-table tbody tr{
    border-bottom:1px dashed var(--line);
    transition:background .15s ease;
}

#lines-table tbody tr:hover{
    background:rgba(47,143,135,.05);
}

#lines-table tr:nth-child(even){
    background:rgba(22,35,58,.02);
}

#lines-table tfoot td{
    padding:12px 8px;
}

#lines-table tfoot tr{
    background:var(--cream-deep) !important;
}

#total_qty{
    background:var(--cream-deep) !important;
    font-weight:700;
    border:none !important;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-top:28px;
}

.summary-grid input{
    height:46px;
    font-weight:600;
}

.balance-card{
    background:linear-gradient(155deg, var(--bottle) 0%, var(--bottle-deep) 100%);
    border:1px solid rgba(212,175,55,.35);
    border-radius:16px;
    padding:26px 28px;
    margin-top:28px;
    color:var(--cream);
    box-shadow:0 16px 32px -18px rgba(21,50,41,.6);
}

.balance-card label{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    display:block;
    margin-bottom:6px;
    color:rgba(246,241,228,.85);
}

.balance-card input{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(212,175,55,.4);
    color:var(--cream);
    font-weight:700;
}

.balance-card input#display_total,
.balance-card input#new_total{
    color:var(--gold);
}

.balance-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.balance-row .field-group:last-child{
    margin-bottom:0;
}

@media (max-width:560px){
    .balance-row{ grid-template-columns:1fr; }
}

.btn-primary{
    background:linear-gradient(180deg, var(--brass-light), var(--brass));
    color:var(--navy);
    border:none;
    padding:13px 30px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    box-shadow:0 8px 18px -8px rgba(176,141,87,.6);
    transition:transform .15s ease, box-shadow .15s ease;
}

.btn-primary:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 22px -8px rgba(176,141,87,.75);
}

.btn-add{
    background:transparent;
    color:var(--teal);
    border:1.5px solid var(--teal);
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    transition:background .15s ease, color .15s ease;
}

.btn-add:hover{
    background:var(--teal);
    color:#fff;
}

.remove-btn{
    background:transparent;
    color:#b0433f;
    border:1.5px solid rgba(176,67,63,.4);
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:background .15s ease, color .15s ease;
}

.remove-btn:hover{
    background:#b0433f;
    color:#fff;
    border-color:#b0433f;
}

.readonly{
    background:rgba(22,35,58,.05) !important;
    color:var(--navy-soft);
    font-family:'IBM Plex Mono',monospace;
}

.customer-suggestions{
    position:absolute;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(4px);
    border:1px solid rgba(176,141,87,.35);
    border-radius:10px;
    max-height:200px;
    overflow-y:auto;
    width:230px;
    z-index:9999;
    box-shadow:0 10px 24px -8px rgba(22,35,58,.3);
    margin-top:4px;
}

.customer-suggestions div{
    padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
}

.customer-suggestions div:hover{
    background:rgba(47,143,135,.12);
}

@media (max-width:640px){
    .edit-container{ padding:24px 18px; margin:16px; }
    .page-title{ font-size:24px; }
}
</style>

<div class="edit-container">

<div class="page-header">
    <h2 class="page-title">Edit Supplier Bill <span class="bill-number">#{{ bill.bill_id }}</span></h2>
</div>

<form method="POST" oninput="recalcTotals()">

    <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">

        <div class="field-group">
            <label>Supplier ID</label>
            <input type="text"
                   value="{{ bill.supplier_id }}"
                   readonly
                   class="readonly">
        </div>

        <div class="field-group">
            <label>Supplier Name</label>
            <input type="text"
                   value="{{ bill.supplier_name }}"
                   readonly
                   class="readonly">
        </div>

        <div class="field-group">
            <label>Bill Date</label>
            <input type="text"
                   value="{{ bill.bill_date.strftime('%d-%m-%Y') if bill.bill_date else '' }}"
                   readonly
                   class="readonly">
        </div>

    </div>

    <input type="hidden"
           name="bill_date"
           value="{{ bill.bill_date }}">

   <h3 class="section-title">Line Items</h3>
    <table id="lines-table" border="0" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
               <th>Customer ID</th>
               <th>Customer Name</th>
               <th>Rate</th>
               <th>Quantity</th>
               <th>Amount</th>

                <th></th>
            </tr>
        </thead>

        <tbody id="lines-body">

          {% for it in items %}
            <tr>
                <td>
                   <input type="number"
                           name="customer_id[]"
                           class="customer-id"
                           value="{{ it.customer_id }}"
                           autocomplete="off"
                           oninput="showCustomerSuggestions(this)">
                    <div class="customer-suggestions"></div>
               </td>

               <td>
                   <input type="text"
                           class="customer-name"
                           value="{{ it.customer_name }}"
                           autocomplete="off"
                           oninput="showCustomerSuggestions(this)">
                    <div class="customer-suggestions" style="display:none;"></div>
               </td>
                <td>
                    <input type="number" step="0.01" name="rate[]" class="rate"
                        value="{{ it.rate }}" oninput="recalcTotals()">
                </td>
                <td>
                    <input type="number" step="0.01" name="quantity[]" class="qty"
                        value="{{ it.quantity }}" oninput="recalcTotals()">

                </td>

                <td>
                    <input type="number" step="0.01" name="amount[]" class="amount" value="{{ it.amount }}" readonly>
                </td>
                <td>
                    <button type="button" class="remove-btn" onclick="removeLine(this)">✕</button>
                </td>
            </tr>
            {% endfor %}

        </tbody>
        <tfoot>
        <tr>
            <td colspan="3" style="text-align:right; font-family:'Inter',sans-serif; font-weight:600; color:var(--navy);">
                Total Quantity
            </td>

            <td>
                <input type="number"
                       id="total_qty"
                       readonly>
            </td>

            <td></td>
            <td></td>
        </tr>
        </tfoot>
    </table>

    <div style="margin-top:16px;">
        <button type="button"
                  class="btn-add"
                  onclick="addLine()">
              + Add Line
          </button>
    </div>

    <div class="summary-grid">

        <div class="field-group">
            <label>Commission</label>
            <input type="text"
               name="commission"
               id="commission"
               value="{{ bill.commission_text if bill.commission_text else bill.commission }}">
        </div>

        <div class="field-group">
            <label>Labour</label>
            <input type="number"
                   step="0.01"
                   name="labour"
                   id="labour"
                   value="{{ bill.labour }}">
        </div>

        <div class="field-group">
            <label>Transport</label>
            <input type="number"
                   step="0.01"
                   name="transport"
                   id="transport"
                   value="{{ bill.transport }}">
        </div>

        <div class="field-group">
            <label>Paid</label>
            <input type="number"
                   step="0.01"
                   name="paid"
                   id="paid"
                   value="{{ bill.paid }}">
        </div>

    </div>

    <div class="balance-card">
        <!-- bill.old_balance is SIGNED. Convert to ABS for UI display -->
        {% set disp_old = bill.old_balance * -1 if bill.old_balance < 0 else bill.old_balance %}

        <div class="balance-row">
            <div class="field-group">
                <label><b>Old Supplier Balance</b></label>
                <input type="number" id="old_balance" readonly value="{{ disp_old|float }}">
            </div>

            <div class="field-group">
                <label><b>Total Bill Amount</b></label>
                <input type="number"
                       id="display_total"
                       readonly>
            </div>
        </div>

        <div class="field-group">
            <label><b>New Total (Resulting Supplier Balance stored)</b></label>
            <input type="number" id="new_total" name="new_total" readonly>
        </div>
    </div>

    <!-- hidden fields for backend -->
    <input type="hidden" id="total_amount" name="total_amount">
    <input type="hidden" id="balance" name="balance">

    <div style="text-align:center; margin-top:28px;">
        <button type="submit" class="btn-primary">
            Save Changes
        </button>
    </div>
</form>

</div>

<script>

const allCustomers = [
{% for c in customers %}
{
    id: "{{ c.customer_id }}",
    name: "{{ c.name }}"
},
{% endfor %}
];

function addLine() {

    const body = document.getElementById('lines-body');

    const tr = document.createElement('tr');

    tr.innerHTML = `
        <td>
            <input type="number"
                   name="customer_id[]"
                   class="customer-id"
                   autocomplete="off"
                   oninput="showCustomerSuggestions(this)">
            <div class="customer-suggestions"></div>
        </td>

        <td>
            <input type="text"
                   class="customer-name"
                   name="customer_name[]"
                   autocomplete="off"
                   oninput="showCustomerSuggestions(this)">
            <div class="customer-suggestions" style="display:none;"></div>
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="rate[]"
                   class="rate"
                   oninput="recalcTotals()">
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="quantity[]"
                   class="qty"
                   oninput="recalcTotals()">
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="amount[]"
                   class="amount"
                   readonly>
        </td>

        <td>
            <button type="button"
                    class="remove-btn"
                    onclick="removeLine(this)">
                ✕
            </button>
        </td>
    `;

    body.appendChild(tr);

    recalcTotals();
}

    function showCustomerSuggestions(input) {

        const row = input.closest("tr");

        let box = row.querySelector(".customer-suggestions");

        if (!box) {
            box = document.createElement("div");
            box.className = "customer-suggestions";
            input.parentNode.appendChild(box);
        }

        const text = String(input.value).toLowerCase().trim();

        box.innerHTML = "";

        if (!text) {
            box.style.display = "none";
            return;
        }

        const isIdField = input.classList.contains("customer-id");

        const matches = allCustomers.filter(c =>
            isIdField
                ? c.id.toString().includes(text)
                : c.name.toLowerCase().includes(text)
        );

        matches.slice(0,20).forEach(c => {

            const div = document.createElement("div");

            div.style.padding = "8px";
            div.style.cursor = "pointer";
            div.innerText = `${c.id} - ${c.name}`;

            div.onclick = function() {

                row.querySelector(".customer-id").value = c.id;
                row.querySelector(".customer-name").value = c.name;

                box.style.display = "none";
            };

            box.appendChild(div);
        });

        box.style.display =
            matches.length ? "block" : "none";
    }

    function removeLine(btn) {
    const body = document.getElementById('lines-body');
    if (body.rows.length > 1) {
        body.removeChild(btn.closest('tr'));
        recalcTotals();
    }
}

// Extra safeguard: block Enter/Space from ever activating a remove-btn
// (or any .btn-add), regardless of how focus got there. Only a genuine
// mouse click (or touch tap) should remove a line.
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;

    const target = e.target;
    if (target.classList && (target.classList.contains('remove-btn') || target.classList.contains('btn-add'))) {
        e.preventDefault();
        e.stopPropagation();
    }
}, true);

function recalcTotals() {

    const rows = document.querySelectorAll('#lines-body tr');

    let total = 0;
    let totalQty = 0;

    rows.forEach(row => {

        const qty = parseFloat(row.querySelector('.qty')?.value) || 0;
        const rate = parseFloat(row.querySelector('.rate')?.value) || 0;

        const amount = qty * rate;

        row.querySelector('.amount').value = amount.toFixed(2);

        total += amount;
        totalQty += qty;
    });

    // Display total bill amount
    document.getElementById("display_total").value = total.toFixed(2);

    // Display total quantity
    document.getElementById("total_qty").value = totalQty.toFixed(2);

    const commissionInput = document.getElementById('commission').value.trim();

    const pct = parseFloat(commissionInput.replace('%', '')) || 0;
    const commission = total * pct / 100;

    const labour = parseFloat(document.getElementById('labour').value) || 0;
    const transport = parseFloat(document.getElementById('transport').value) || 0;
    const paid = parseFloat(document.getElementById('paid').value) || 0;

    const bill_balance = total - commission - labour - transport - paid;

    // Hidden field submitted to backend
    document.getElementById('total_amount').value = total.toFixed(2);

    const old_abs = parseFloat(document.getElementById("old_balance").value) || 0;
    const old_signed = -old_abs;

    const new_total_positive = Math.abs(old_signed) + bill_balance;
    const new_signed_balance = -new_total_positive;

    document.getElementById("new_total").value = new_signed_balance.toFixed(2);
    document.getElementById("balance").value = new_signed_balance.toFixed(2);
}

recalcTotals();

// -----------------------------------------------------------------
// Prevent accidental submission on Enter key.
// Only the "Save Changes" button (or an explicit form.submit()) should
// save the bill. Pressing Enter inside any field now just moves focus
// to the next input instead of submitting the form.
// -----------------------------------------------------------------
const billForm = document.querySelector('form');

billForm.addEventListener('keydown', function (e) {

    if (e.key !== 'Enter') return;

    // Let Enter behave normally inside a <textarea> (new line).
    const tag = e.target.tagName;
    const type = (e.target.getAttribute('type') || '').toLowerCase();

    if (tag === 'TEXTAREA') return;

    // Only the real "Save Changes" submit button should ever respond to
    // Enter. Buttons like "Remove (x)" and "+ Add Line" are type="button"
    // and must NEVER fire from an accidental Enter press - they should
    // only be triggered by an explicit mouse/tap click.
    if (tag === 'BUTTON' && type === 'submit') {
        // Allow the Save button itself to be activated with Enter.
        return;
    }

    if (tag === 'BUTTON') {
        // Block Enter from clicking remove-btn / btn-add / any other
        // non-submit button, and just move focus onward instead.
        e.preventDefault();

        const focusableBtns = Array.from(
            billForm.querySelectorAll(
                'input:not([type=hidden]):not([disabled]):not([readonly]), select, textarea, button'
            )
        ).filter(el => el.offsetParent !== null);

        const idx = focusableBtns.indexOf(e.target);
        if (idx > -1 && idx < focusableBtns.length - 1) {
            focusableBtns[idx + 1].focus();
        } else {
            e.target.blur();
        }
        return;
    }

    // Stop the browser's default "submit on Enter" behavior.
    e.preventDefault();

    // Nicety: move focus to the next focusable field, like pressing Tab.
    const focusable = Array.from(
        billForm.querySelectorAll(
            'input:not([type=hidden]):not([disabled]):not([readonly]), select, textarea, button'
        )
    ).filter(el => el.offsetParent !== null); // only visible fields

    const currentIndex = focusable.indexOf(e.target);

    if (currentIndex > -1 && currentIndex < focusable.length - 1) {
        focusable[currentIndex + 1].focus();
    } else {
        e.target.blur();
    }
});

// Belt-and-suspenders: also guard the submit event itself so the bill
// can only be saved via a genuine submit-button activation/click.
billForm.addEventListener('submit', function (e) {
    const submitter = e.submitter; // the element that triggered submit

    if (!submitter || submitter.type !== 'submit') {
        e.preventDefault();
    }
});
</script>

{% endblock %}

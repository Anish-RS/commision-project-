{% extends "base.html" %}
{% block content %}

<style>
  * { box-sizing: border-box; }

  :root {
    --cream: #f4f0e2;
    --card: #fffdf7;
    --gold: #c9a15a;
    --gold-dark: #a97f36;
    --gold-line: #e6d7ae;
    --green: #163c2f;
    --green-mid: #1f5b46;
    --ink: #1e2a22;
    --muted: #7c7566;
  }

  body {
    background: var(--cream);
  }

  .page-wrap {
    max-width: 960px;
    width: 100%;
    margin: 28px auto;
    padding: 0 20px;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    align-self: stretch;
  }

  /* ---------- Header ---------- */
  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    width: 100%;
    align-self: stretch;
  }

  .page-header-left {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    min-width: 0;
  }

  .page-icon {
    flex: none;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--green-mid), var(--green));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(22,60,47,0.30);
    border: 2px solid #e9dcb8;
  }

  .page-icon svg {
    width: 24px;
    height: 24px;
    stroke: #f1e6c8;
  }

  .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 3px 0 6px;
  }

  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dark);
  }

  .page-heading h2 {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: -0.2px;
  }

  .page-heading p {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.5;
  }

  /* Divider line under the header */
  .header-divider {
    height: 3px;
    background: var(--green);
    border-radius: 2px;
    margin: 0 0 22px;
    width: 100%;
  }

  /* Circular stamp/seal */
  .seal {
    flex: none;
    width: 92px;
    height: 92px;
    position: relative;
  }

  .seal svg {
    width: 100%;
    height: 100%;
  }

  .seal circle.ring {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
    stroke-dasharray: 3 3;
  }

  .seal textPath {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 9.5px;
    letter-spacing: 1.5px;
    fill: var(--gold-dark);
  }

  .seal-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 60px;
  }

  .seal-center span {
    display: block;
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 9.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--gold-dark);
    line-height: 1.3;
  }

  /* ---------- Card ---------- */
  .card {
    background: var(--card);
    padding: 28px 30px;
    border-radius: 14px;
    margin: 0 0 18px;
    box-shadow: 0 10px 26px rgba(22,60,47,0.07);
    border: 1px solid var(--gold-line);
    border-top: 3px solid var(--gold);
    width: 100%;
    align-self: stretch;
    display: block;
  }

  /* Fights any global .card rules from base.html (e.g. flex-basis / max-width)
     that were shrinking and centering this form */
  #paymentCard.card {
    width: 100% !important;
    max-width: 100% !important;
    flex: 1 1 100% !important;
    flex-basis: 100% !important;
    display: block !important;
    box-sizing: border-box !important;
  }

  #payment-form {
    width: 100%;
    display: block;
  }

  label {
    display: block;
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .input-field, select.input-field {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd4bd;
    background: #fbf9f2;
    outline: none;
    transition: 0.16s ease;
    font-size: 15px;
    height: 46px;
    line-height: 20px;
    color: var(--ink);
    font-weight: 500;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  select.input-field {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, rgba(22,60,47,0.45) 50%),
                      linear-gradient(135deg, rgba(22,60,47,0.45) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(1em + 2px), calc(100% - 13px) calc(1em + 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
    cursor: pointer;
  }

  .input-field:focus, select.input-field:focus {
    border-color: var(--gold);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(201,161,90,0.16);
  }

  .input-field::placeholder { color: #a89f8c; }

  .form-row { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .col-full { width: 100%; min-width: 0; }
  .col-half { flex: 1 1 45%; min-width: 220px; }

  .grid-amount-note {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 14px;
    align-items: start;
  }

  .amount-wrap { position: relative; }
  .amount-wrap .currency-prefix {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold-dark);
    font-weight: 700;
    font-size: 15px;
    pointer-events: none;
    font-family: 'Courier New', monospace;
  }
  .amount-wrap input {
    padding-left: 30px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* Info banner */
  .info-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #faf3df;
    border: 1px solid var(--gold-line);
    color: var(--gold-dark);
    font-size: 13.5px;
    font-weight: 600;
    padding: 13px 16px;
    border-radius: 10px;
    margin: 0 0 18px;
    width: 100%;
    align-self: stretch;
  }
  .info-banner svg { flex: none; width: 18px; height: 18px; stroke: var(--gold-dark); }

  .small-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--gold-line);
  }

  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }

  .btn-primary {
    background: linear-gradient(155deg, var(--green-mid), var(--green));
    color: #f4ecd2;
    box-shadow: 0 8px 18px rgba(22,60,47,0.30);
    transition: 0.15s ease;
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(22,60,47,0.38);
  }

  .btn-primary:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-primary svg { width: 16px; height: 16px; stroke: #f4ecd2; }

  /* Suggestions dropdown */
  #suggestions {
    border: 1px solid var(--gold-line) !important;
    box-shadow: 0 12px 28px rgba(22,60,47,0.14) !important;
    background: #fff;
  }

  .suggestion-item {
    font-size: 14.5px;
    color: var(--ink);
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .suggestion-item.active {
    background: #eef6f1;
  }

  .suggestion-item:hover {
    background: #faf3df;
  }

  @media (max-width: 720px) {
    .grid-amount-note { grid-template-columns: 1fr; }
    .card { padding: 20px; }
    .page-header { flex-wrap: wrap; }
    .col-half { flex: 1 1 100%; }
  }
</style>

<div class="page-wrap">

  <div class="page-header">
    <div class="page-header-left">
      <div class="page-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="14" rx="3"></rect>
          <path d="M2 10h20"></path>
          <path d="M6 15h4"></path>
        </svg>
      </div>
      <div class="page-heading">
        <div class="eyebrow-row">
          <span class="eyebrow">Ledger &middot; Payment Entry</span>
        </div>
        <h2>Payment</h2>
        <p>Record money paid out to a customer or supplier.</p>
      </div>
    </div>

    <div class="seal">
      <svg viewBox="0 0 100 100">
        <circle class="ring" cx="50" cy="50" r="46"/>
        <path id="sealArcTopPmt" d="M 8,50 A 42,42 0 1,1 92,50" fill="none"/>
        <text>
          <textPath href="#sealArcTopPmt" startOffset="50%" text-anchor="middle">PAYMENT ENTRY</textPath>
        </text>
      </svg>
      <div class="seal-center">
        <span>Ledger</span>
        <span>Entry</span>
      </div>
    </div>
  </div>

  <div class="header-divider"></div>



  <div class="card" id="paymentCard">
    <form method="POST" id="payment-form" novalidate>

      <div class="form-row" style="margin-bottom:16px;">
        <div class="col-half">
          <label for="tx_date">Date</label>
          <input type="date" name="tx_date" id="tx_date" class="input-field" required>
        </div>

        <div class="col-half">
          <label for="entity_type">Entity Type</label>
          <select name="entity_type" id="entity_type" class="input-field" required>
            <option value="supplier">Supplier</option>
            <option value="customer">Customer</option>
          </select>
        </div>
      </div>

      <div class="form-row" style="margin-bottom:16px;">
        <div class="col-full">
          <label for="entity_search">Customer / Supplier</label>

          <input type="text"
                 id="entity_search"
                 name="entity_name"
                 class="input-field"
                 placeholder="Type ID or name..."
                 autocomplete="off"
                 required>

          <div id="suggestions"
               style="
                  display:none;
                  border-radius:12px;
                  max-height:220px;
                  overflow-y:auto;
                  margin-top:6px;
                  z-index:999;
                  position:relative;">
          </div>

          <div class="small-note">
            Type a name or ID &mdash; matching suggestions appear automatically.
          </div>
        </div>
      </div>

      <div class="grid-amount-note">
        <div>
          <label for="amount">Amount (&#8377;)</label>
          <div class="amount-wrap">
            <span class="currency-prefix">&#8377;</span>
            <input type="number" step="0.01" name="amount" id="amount" class="input-field" placeholder="0.00" required>
          </div>
        </div>

        <div>
          <label for="note">Note (optional)</label>
          <input type="text" name="note" id="note" class="input-field" placeholder="Add a note...">
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
            <path d="M17 21v-8H7v8"></path>
            <path d="M7 3v5h8"></path>
          </svg>
          Save Payment
        </button>
      </div>

    </form>
  </div>

</div>

<script>
const allEntities = [
{% for c in customers %}
{
  type: "customer",
  value: "{{ c.id }} - {{ c.name }}"
},
{% endfor %}

{% for s in suppliers %}
{
  type: "supplier",
  value: "{{ s.id }} - {{ s.name }}"
},
{% endfor %}
];

const input = document.getElementById("entity_search");
const suggestions = document.getElementById("suggestions");
let activeIndex = -1;

input.addEventListener("input", function () {
  activeIndex = -1;
  const text = this.value.toLowerCase().trim();
  const entityType = document.getElementById("entity_type").value;

  suggestions.innerHTML = "";

  if (text.length < 1) {
    suggestions.style.display = "none";
    return;
  }

  const matches = allEntities.filter(x =>
      x.type === entityType &&
      x.value.toLowerCase().includes(text)
  );

  activeIndex = matches.length ? 0 : -1;
  input.dataset.autofilled = "false";

  matches.slice(0, 20).forEach(item => {
    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.style.padding = "10px 14px";
    div.style.cursor = "pointer";
    div.style.borderBottom = "1px solid #eef1f5";
    div.innerText = item.value;

    div.onclick = function () {
        input.value = item.value;
        suggestions.style.display = "none";
        setTimeout(() => {
            document.getElementById("amount").focus();
        }, 0);
    };

    suggestions.appendChild(div);
  });

  suggestions.style.display = matches.length ? "block" : "none";

  if (activeIndex === 0) {
    const first = suggestions.querySelector(".suggestion-item");
    if (first) {
        first.classList.add("active");
    }
  }
});

input.addEventListener("keydown", function(e){
    const items = suggestions.querySelectorAll(".suggestion-item");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        if (activeIndex < items.length - 1) {
            activeIndex++;
        }
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (activeIndex > 0) {
            activeIndex--;
        }
    } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIndex >= 0) {
            items[activeIndex].click();
            return;
        } else if (items.length === 1) {
            items[0].click();
            return;
        }
        return;
    }

    items.forEach(i => i.classList.remove("active"));

    if (activeIndex >= 0) {
        items[activeIndex].classList.add("active");
        items[activeIndex].scrollIntoView({
            block: "nearest"
        });
    }
});

document.addEventListener("click", function(e){
  if (!suggestions.contains(e.target) && e.target !== input) {
      suggestions.style.display = "none";
  }
});

// prevent empty submissions and double clicks
let paymentSubmitting = false;

document.getElementById("payment-form").addEventListener("submit", function(e) {
    if (!document.getElementById("entity_search").value.trim()) {
        e.preventDefault();
        alert("Please select a customer/supplier.");
        return false;
    }

    if (paymentSubmitting) {
        e.preventDefault();
        return false;
    }

    paymentSubmitting = true;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerHTML = "Saving Payment...";
});

// init on page load
document.addEventListener("DOMContentLoaded", function() {
    const dateInput = document.getElementById("tx_date");

    if (!dateInput.value) {
        const today = new Date().toISOString().split("T")[0];
        dateInput.value = today;
    }

    setTimeout(() => {
        const search = document.getElementById("entity_search");
        search.focus();
        search.select();
    }, 100);
});

// Enter key dynamics to jump between inputs
document.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;

    const active = document.activeElement;

    // Entity -> Amount
    if (active.id === "entity_search") {
        e.preventDefault();
        document.getElementById("amount").focus();
        return;
    }

    // Amount -> Note
    if (active.id === "amount") {
        e.preventDefault();
        document.getElementById("note").focus();
        return;
    }

    // Note -> Submit
    if (active.id === "note") {
        e.preventDefault();

        if (paymentSubmitting) return;

        document.getElementById("payment-form").requestSubmit();
        return;
    }
});

// Clear input and focus when changing entity type
document.getElementById("entity_type").addEventListener("change", function(){
    activeIndex = -1;
    input.value = "";
    suggestions.innerHTML = "";
    suggestions.style.display = "none";
    setTimeout(() => input.focus(), 0);
});
</script>
{% endblock %}

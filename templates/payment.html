
{% extends "base.html" %}
{% block content %}
<style>
* { box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #fff0f4, #ffd6e7);
}

.page-title {
  text-align: center;
  color: #6C63FF;
  font-size: 26px;
  font-weight: 700;
  margin: 20px 0;
}

.suggestion-item.active{
    background:#90caf9;
}

.card {
  max-width: 560px;
  margin: 0 auto;
  background: rgba(255,255,255,0.96);
  padding: 22px;
  border-radius: 14px;
  border-left: 6px solid #90CAF9;
  box-shadow: 0 10px 30px rgba(28,37,70,0.08);
}

.form-group {
  margin-bottom: 14px;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  height: 44px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 2px solid #dbefff;
  background: #eaf6ff;
  font-size: 15px;
  outline: none;
  transition: 0.15s;
}

input:focus, select:focus {
  background: #fff;
  border-color: #64b5f6;
  box-shadow: 0 4px 12px rgba(100,181,246,0.15);
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #ff9a9a, #ff6b6b);
  color: white;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(255,107,107,0.2);
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(255,107,107,0.3);
}
</style>

<h2>Payment (Money Paid)</h2>

<form method="POST" style="max-width:560px;" id="paymentForm">

  <div>
    <label>Date:</label>
    <input type="date" name="tx_date" id="tx_date" required>
  </div>

  <div>
    <label>Entity Type:</label>
    <select name="entity_type" id="entity_type" required>
      <option value="supplier">Supplier</option>
      <option value="customer">Customer</option>
    </select>
  </div>

  <div>
    <label>Customer / Supplier:</label>
    <input type="text"
           id="entity_search"
           name="entity_name"
           placeholder="Type ID or Name..."
           autocomplete="off"
           required>
    
    <div id="suggestions"
         style="
            display:none;
            background:#fff;
            border:1px solid #ddd;
            border-radius:10px;
            max-height:220px;
            overflow-y:auto;
            margin-top:4px;">
    </div>
  </div>

  <div>
    <label>Amount:</label>
    <input type="number" step="0.01" name="amount" required>
  </div>

  <div>
    <label>Note (optional):</label>
    <input type="text" name="note">
  </div>

  <div style="margin-top:10px;">
    <button type="submit">Save Payment</button>
  </div>

</form>

<script>
const allEntities = [
{% for c in customers %}
{
  type: "customer",
  value: "{{ c.id }} - {{ c.name }}"
},
{% endfor %}

{% for s in suppliers %}
{
  type: "supplier",
  value: "{{ s.id }} - {{ s.name }}"
},
{% endfor %}
];

const input = document.getElementById("entity_search");
const suggestions = document.getElementById("suggestions");
let activeIndex = -1;

input.addEventListener("input", function () {
  activeIndex = -1;
  const text = this.value.toLowerCase().trim();
  const entityType = document.getElementById("entity_type").value;

  suggestions.innerHTML = "";

  if (text.length < 1) {
    suggestions.style.display = "none";
    return;
  }

  const matches = allEntities.filter(x =>
      x.type === entityType &&
      x.value.toLowerCase().includes(text)
  );
  
  activeIndex = matches.length ? 0 : -1;
  input.dataset.autofilled = "false";

  matches.slice(0, 20).forEach(item => {
    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.style.padding = "10px";
    div.style.cursor = "pointer";
    div.innerText = item.value;

    div.onclick = function () {
        input.value = item.value;
        suggestions.style.display = "none";
        setTimeout(() => {
            document.querySelector("[name='amount']").focus();
        }, 0);
    };

    suggestions.appendChild(div);
  });

  suggestions.style.display = matches.length ? "block" : "none";
  
  if (activeIndex === 0) {
    const first = suggestions.querySelector(".suggestion-item");
    if (first) {
        first.classList.add("active");
    }
  }
});

input.addEventListener("keydown", function(e){
    const items = suggestions.querySelectorAll(".suggestion-item");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        if (activeIndex < items.length - 1) {
            activeIndex++;
        }
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (activeIndex > 0) {
            activeIndex--;
        }
    } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIndex >= 0) {
            items[activeIndex].click();
            return;
        } else if (items.length === 1) {
            items[0].click();
            return;
        }
        return;
    }
    
    items.forEach(i => i.classList.remove("active"));

    if (activeIndex >= 0) {
        items[activeIndex].classList.add("active");
        items[activeIndex].scrollIntoView({
            block: "nearest"
        });
    }
});

document.addEventListener("click", function(e){
  if (!suggestions.contains(e.target) && e.target !== input) {
      suggestions.style.display = "none";
  }
});

// prevent empty submissions and double clicks
let paymentSubmitting = false;

document.getElementById("paymentForm").addEventListener("submit", function(e) {
    if (!document.getElementById("entity_search").value.trim()) {
        e.preventDefault();
        alert("Please select a customer/supplier.");
        return false;
    }

    if (paymentSubmitting) {
        e.preventDefault();
        return false;
    }

    paymentSubmitting = true;

    const btn = document.querySelector("#paymentForm button[type='submit']");
    btn.disabled = true;
    btn.innerText = "Saving Payment...";
});

// init on page load
document.addEventListener("DOMContentLoaded", function() {
    const dateInput = document.getElementById("tx_date");

    if (!dateInput.value) {
        const today = new Date().toISOString().split("T")[0];
        dateInput.value = today;
    }

    setTimeout(() => {
        const search = document.getElementById("entity_search");
        search.focus();
        search.select();
    }, 100);
});

// Enter key dynamics to jump between inputs
document.addEventListener("keydown", function(e){
    if (e.key !== "Enter") return;

    const active = document.activeElement;

    // Entity -> Amount
    if (active.id === "entity_search") {
        e.preventDefault();
        document.querySelector("[name='amount']").focus();
        return;
    }

    // Amount -> Note
    if (active.name === "amount") {
        e.preventDefault();
        document.querySelector("[name='note']").focus();
        return;
    }

    // Note -> Submit
    if (active.name === "note") {
        e.preventDefault();

        if (paymentSubmitting) return;

        document.getElementById("paymentForm").requestSubmit();
        return;
    }
});

// Clear input and focus when changing entity type
document.getElementById("entity_type").addEventListener("change", function(){
    activeIndex = -1;
    input.value = "";
    suggestions.innerHTML = "";
    suggestions.style.display = "none";
    setTimeout(() => input.focus(), 0);
});
</script>
{% endblock %}
